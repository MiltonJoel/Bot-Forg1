[project]
name = "forg1-monitor"
version = "0.1.0"
description = "Read-only monitor for forg1.com predictions: detects new predictions, computes a suggested bet, and pushes it to Telegram. Never places bets."
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.45",
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "tenacity>=8.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
